<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Void</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <h1>Welcome to The Void</h1>
        
        <div class="container">
            <div id="yell-section">
                <h3>Yell into The Void here!</h3>
                <div id="yell-box">
                    <textarea id="yell-message" maxlength="1000" placeholder="Write a message to The Void..."></textarea>
                    <div id="character-count">0 / 1000</div>
                </div>
                <button id="yell-btn">Yell</button>
            </div>
            
            <div id="peek-section">
                <h3>Peek into The Abyss Here</h2>
                <textarea id="peek-message" readonly>A message from The Abyss...</textarea>
                <button id="peek-btn">Peek</button>
            </div>        
        </div>

        <script src="/static/script.js"></script>
    </body>
</html>
